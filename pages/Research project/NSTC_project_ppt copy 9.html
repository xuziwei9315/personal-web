<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Q&amp;A - ICIM 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        @import url("https://www.genspark.ai/image_placeholder.png");
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            height: 100%;
            overflow: hidden;
        }
        
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Noto Sans TC', sans-serif;
            background: #0f172a;
            color: #ffffff;
        }
        
        .slide-container {
            position: relative;
            width: 1280px;
            height: 720px;
            overflow: hidden;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        }
        
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: 
                radial-gradient(circle at 25% 25%, #ffffff 1px, transparent 1px),
                radial-gradient(circle at 75% 75%, #ffffff 1px, transparent 1px),
                radial-gradient(circle at 50% 50%, #ffffff 1px, transparent 1px);
            background-size: 80px 80px, 120px 120px, 100px 100px;
        }
        
        .main-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 24px 40px;
            box-sizing: border-box;
            overflow: hidden;
        }
        
        .thank-you-section {
            text-align: center;
            margin-bottom: 28px;
            flex-shrink: 0;
        }
        
        .thank-you-title {
            font-size: clamp(48px, 12vw, 88px);
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.05;
        }
        
        .thank-you-subtitle {
            font-size: 22px;
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: 4px;
        }
        
        .qa-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 22px 32px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 28px;
            width: min(460px, 100%);
            max-width: 100%;
            height: auto;
            min-height: 120px;
            flex-shrink: 0;
            box-sizing: border-box;
        }
        
        .qa-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
            flex-shrink: 0;
        }
        
        .qa-content {
            flex: 1;
        }
        
        .qa-title {
            font-size: 34px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 5px;
        }
        
        .qa-subtitle {
            font-size: 16px;
            color: #94a3b8;
        }
        
        .contact-section {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            width: 100%;
            max-width: 1100px;
            flex-shrink: 0;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 0;
            flex: 1 1 160px;
            max-width: 100%;
            box-sizing: border-box;
        }
        
        .contact-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
            flex-shrink: 0;
        }
        
        .contact-text {
            font-size: 15px;
            color: #e2e8f0;
            font-weight: 500;
        }
        
        .contact-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 2px;
        }
        
        .decorative-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .circle-1 {
            position: absolute;
            width: 300px;
            height: 300px;
            border: 2px solid rgba(59, 130, 246, 0.1);
            border-radius: 50%;
            top: -100px;
            right: -100px;
            animation: rotate 20s linear infinite;
        }
        
        .circle-2 {
            position: absolute;
            width: 250px;
            height: 250px;
            border: 2px solid rgba(139, 92, 246, 0.1);
            border-radius: 50%;
            bottom: -50px;
            left: -50px;
            animation: rotate 15s linear infinite reverse;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="slide-container">
<div class="bg-pattern"></div>
<div class="decorative-elements">
<div class="circle-1"></div>
<div class="circle-2"></div>
</div>
<div class="main-content" data-object="true" data-object-type="textbox" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; max-width: 1280px; max-height: 720px; box-sizing: border-box;">
<div class="thank-you-section">
<div class="thank-you-title">Thank You</div>
<div class="thank-you-subtitle">感謝您的聆聽</div>
</div>
<div class="qa-section">
<div class="qa-icon">
<i class="fas fa-comments"></i>
</div>
<div class="qa-content">
<div class="qa-title">Q &amp; A</div>
<div class="qa-subtitle">歡迎提出問題，讓我們一起討論</div>
</div>
</div>
<div class="contact-section">
<div class="contact-item">
<div class="contact-icon">
<i class="fas fa-user"></i>
</div>
<div>
<div class="contact-label">講者</div>
<div class="contact-text">徐子崴</div>
</div>
</div>
<div class="contact-item">
<div class="contact-icon">
<i class="fas fa-university"></i>
</div>
<div>
<div class="contact-label">單位</div>
<div class="contact-text">輔仁大學資管系</div>
</div>
</div>
<div class="contact-item">
<div class="contact-icon">
<i class="fas fa-envelope"></i>
</div>
<div>
<div class="contact-label">聯絡</div>
<div class="contact-text">contact@example.com</div>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
