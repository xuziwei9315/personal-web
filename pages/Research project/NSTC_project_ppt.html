<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>大型語言模型應用在詐騙偵測之研究 - ICIM 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        @import url("https://www.genspark.ai/image_placeholder.png");
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            height: 100%;
            overflow: hidden;
        }
        
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a2744 50%, #0d1a2d 100%);
            color: #ffffff;
        }
        
        .slide-container {
            position: relative;
            width: 1280px;
            height: 720px;
            overflow: hidden;
            background: linear-gradient(135deg, #0a1628 0%, #1a2744 50%, #0d1a2d 100%);
        }
        
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: 
                radial-gradient(circle at 20% 50%, #ffffff 1px, transparent 1px),
                radial-gradient(circle at 80% 50%, #ffffff 1px, transparent 1px),
                radial-gradient(circle at 50% 20%, #ffffff 1px, transparent 1px),
                radial-gradient(circle at 50% 80%, #ffffff 1px, transparent 1px);
            background-size: 100px 100px, 150px 150px, 80px 80px, 120px 120px;
            animation: float 20s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .geometric-shape {
            position: absolute;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
        }
        
        .shape-1 {
            width: 300px;
            height: 300px;
            top: -150px;
            right: -100px;
            background: linear-gradient(135deg, rgba(59,130,246,0.1), transparent);
        }
        
        .shape-2 {
            width: 200px;
            height: 200px;
            bottom: -100px;
            left: -50px;
            background: linear-gradient(135deg, rgba(139,92,246,0.1), transparent);
        }
        
        .main-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 36px 56px 28px;
            z-index: 10;
            box-sizing: border-box;
            overflow: hidden;
        }
        
        .conference-badge {
            position: absolute;
            top: 30px;
            right: 60px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .conference-badge i {
            color: #3b82f6;
            font-size: 18px;
        }
        
        .conference-badge span {
            font-size: 14px;
            font-weight: 500;
            color: #e2e8f0;
        }
        
        .title-section {
            text-align: center;
            margin-bottom: 14px;
            flex-shrink: 0;
        }
        
        .main-title {
            font-size: 46px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: -0.01em;
            line-height: 1.25;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .main-title .highlight {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            font-size: 22px;
            color: #94a3b8;
            margin-bottom: 14px;
            font-weight: 400;
        }
        
        .conference-info {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px;
            padding: 10px 30px;
            margin-bottom: 20px;
        }
        
        .conference-info i {
            color: #3b82f6;
            font-size: 16px;
        }
        
        .conference-info span {
            font-size: 16px;
            color: #e2e8f0;
        }
        
        .author-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        
        .author-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 18px 28px;
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            width: 260px;
        }
        
        .author-card:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }
        
        .author-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            font-weight: 600;
            flex-shrink: 0;
        }
        
        .author-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .author-name {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }
        
        .author-affiliation {
            font-size: 14px;
            color: #94a3b8;
        }
        
        .highlights-section {
            display: flex;
            gap: 14px;
            margin-bottom: 12px;
            justify-content: center;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        
        .highlight-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 16px 12px;
            width: 158px;
            height: 118px;
            text-align: center;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .highlight-icon {
            font-size: 28px;
            color: #3b82f6;
            margin-bottom: 12px;
        }
        
        .highlight-title {
            font-size: 15px;
            color: #e2e8f0;
            margin-bottom: 8px;
        }
        
        .highlight-value {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }
        
        .bottom-decoration {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #3b82f6);
        }
        
        .metrics-section {
            display: flex;
            gap: 16px;
            justify-content: center;
            width: 100%;
            margin-top: 0;
            padding-bottom: 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        
        .metric-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 10px 16px;
            min-width: 0;
            max-width: 100%;
        }
        
        .metric-icon {
            color: #3b82f6;
            font-size: 20px;
        }
        
        .metric-text {
            font-size: 14px;
            color: #94a3b8;
        }
        
        .metric-value {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }
    </style>
</head>
<body>
<div class="slide-container">
<!-- 背景裝飾 -->
<div class="bg-pattern"></div>
<div class="geometric-shape shape-1"></div>
<div class="geometric-shape shape-2"></div>
<!-- 會議標誌 -->
<div class="conference-badge">
<i class="fas fa-graduation-cap"></i>
<span>ICIM 2026</span>
</div>
<!-- 主內容 -->
<div class="main-content">
<!-- 標題區域 -->
<div class="title-section">
<h1 class="main-title">
                    大型<span class="highlight">語言模型</span>應用在<br/>
                    詐騙偵測之研究
                </h1>
<div class="subtitle">
                    探討 LLM 在語意理解與情緒操控辨識上的應用效果
                </div>
<div class="conference-info">
<i class="fas fa-calendar-alt"></i>
<span>ICIM 2026 第37屆國際資訊管理學術研討會</span>
<span style="margin-left: 15px; opacity: 0.3;">|</span>
<span style="margin-left: 15px;">2026/05</span>
</div>
</div>
<!-- 作者資訊 -->
<div class="author-section">
<div class="author-card">
<div class="author-avatar">徐</div>
<div class="author-info">
<div class="author-name">徐子崴</div>
</div>
</div>
<div class="author-card">
<div class="author-avatar" style="background: linear-gradient(135deg, #8b5cf6, #ec4899);">
<i class="fas fa-university"></i>
</div>
<div class="author-info">
<div class="author-name">輔仁大學</div>
<div class="author-affiliation">資訊管理學系</div>
</div>
</div>
</div>
<!-- 研究亮點 -->
<div class="highlights-section">
<div class="highlight-card">
<div class="highlight-icon">
<i class="fas fa-brain"></i>
</div>
<div class="highlight-title">模型類型</div>
<div class="highlight-value">6種</div>
</div>
<div class="highlight-card">
<div class="highlight-icon">
<i class="fas fa-database"></i>
</div>
<div class="highlight-title">資料集</div>
<div class="highlight-value">354筆</div>
</div>
<div class="highlight-card">
<div class="highlight-icon">
<i class="fas fa-chart-line"></i>
</div>
<div class="highlight-title">準確率</div>
<div class="highlight-value">94%</div>
</div>
<div class="highlight-card">
<div class="highlight-icon">
<i class="fas fa-clock"></i>
</div>
<div class="highlight-title">推論時間</div>
<div class="highlight-value">0.24s</div>
</div>
</div>
<!-- 指標區域 -->
<div class="metrics-section">
<div class="metric-item">
<i class="fas fa-check-circle metric-icon"></i>
<div>
<div class="metric-text">準確率提升</div>
<div class="metric-value">+46%</div>
</div>
</div>
<div class="metric-item">
<i class="fas fa-bolt metric-icon"></i>
<div>
<div class="metric-text">推論速度</div>
<div class="metric-value">0.24s</div>
</div>
</div>
<div class="metric-item">
<i class="fas fa-shield-alt metric-icon"></i>
<div>
<div class="metric-text">詐騙偵測</div>
<div class="metric-value">100%</div>
</div>
</div>
</div>
</div>
<!-- 底部裝飾 -->
<div class="bottom-decoration"></div>
</div>
</body>
</html>
