<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>研究背景與動機 - ICIM 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        @import url("https://www.genspark.ai/image_placeholder.png");
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #ffffff;
        }
        
        .slide-container {
            position: relative;
            width: 1280px;
            height: 720px;
            overflow: hidden;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        }
        
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: 
                radial-gradient(circle at 25% 25%, #ffffff 1px, transparent 1px),
                radial-gradient(circle at 75% 75%, #ffffff 1px, transparent 1px),
                radial-gradient(circle at 50% 50%, #ffffff 1px, transparent 1px);
            background-size: 80px 80px, 120px 120px, 100px 100px;
        }
        
        .header {
            position: absolute;
            top: 30px;
            left: 60px;
            right: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        
        .title-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .title-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        
        .title-text {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.01em;
        }
        
        .title-sub {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 2px;
        }
        
        .page-number {
            font-size: 16px;
            color: #64748b;
            font-weight: 500;
        }
        
        .main-content {
            position: absolute;
            top: 110px;
            left: 60px;
            right: 60px;
            bottom: 40px;
            display: flex;
            gap: 30px;
        }
        
        .left-section {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .right-section {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .section-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .card-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            flex-shrink: 0;
        }
        
        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
        }
        
        .card-subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 2px;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
        }
        
        .highlight-item {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
        }
        
        .highlight-number {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }
        
        .highlight-text {
            font-size: 15px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 2px;
        }
        
        .highlight-desc {
            font-size: 12px;
            color: #94a3b8;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 22px 15px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: #3b82f6;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 13px;
            color: #94a3b8;
        }
        
        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .chart-title {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .chart-title i {
            color: #3b82f6;
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="slide-container">
<div class="bg-pattern"></div>
<div class="header">
<div class="title-section">
<div class="title-icon"><i class="fas fa-chart-line"></i></div>
<div>
<div class="title-text">研究背景與動機</div>
<div class="title-sub">探討詐騙偵測的現況與挑戰</div>
</div>
</div>
<div class="page-number">02 / 10</div>
</div>
<div class="main-content">
<!-- Left Section -->
<div class="left-section">
<div class="section-card" style="flex: 1.5;">
<div class="card-header">
<div class="card-icon"><i class="fas fa-exclamation-triangle"></i></div>
<div>
<div class="card-title">台灣詐騙案件現況</div>
<div class="card-subtitle">近年來詐騙案件持續增加，投資、交友與假冒身分等類型盛行</div>
</div>
</div>
<div class="content-grid">
<div class="highlight-item">
<div class="highlight-number">1</div>
<div class="highlight-content">
<div class="highlight-text">詐騙案件逐年增加</div>
<div class="highlight-desc">2024年詐騙案件較前一年增加15%</div>
</div>
</div>
<div class="highlight-item">
<div class="highlight-number">2</div>
<div class="highlight-content">
<div class="highlight-text">投資詐騙盛行</div>
<div class="highlight-desc">佔整體詐騙案件的35%</div>
</div>
</div>
<div class="highlight-item">
<div class="highlight-number">3</div>
<div class="highlight-content">
<div class="highlight-text">情緒操控型詐騙</div>
<div class="highlight-desc">利用心理弱點進行詐騙</div>
</div>
</div>
<div class="highlight-item">
<div class="highlight-number">4</div>
<div class="highlight-content">
<div class="highlight-text">隱性詐騙難辨識</div>
<div class="highlight-desc">無明顯關鍵字特徵</div>
</div>
</div>
</div>
</div>
<div class="section-card" style="flex: 1;">
<div class="card-header">
<div class="card-icon"><i class="fas fa-brain"></i></div>
<div>
<div class="card-title">傳統方法限制</div>
<div class="card-subtitle">關鍵字比對效果下降，無法應對隱性詐騙</div>
</div>
</div>
<div style="display: flex; gap: 40px; align-items: center; padding: 0 10px;">
<div style="flex: 1;">
<div style="font-size: 15px; color: #e2e8f0; margin-bottom: 12px; display: flex; justify-content: space-between;">
<span>傳統關鍵字比對準確率</span>
<span style="font-weight: 700; color: #3b82f6;">48%</span>
</div>
<div class="progress-bar">
<div class="progress-fill" style="width: 48%;"></div>
</div>
</div>
<div style="flex: 1;">
<div style="font-size: 15px; color: #e2e8f0; margin-bottom: 12px; display: flex; justify-content: space-between;">
<span>情緒操控辨識率</span>
<span style="font-weight: 700; color: #3b82f6;">32%</span>
</div>
<div class="progress-bar">
<div class="progress-fill" style="width: 32%;"></div>
</div>
</div>
</div>
</div>
</div>
<!-- Right Section -->
<div class="right-section">
<div class="section-card" style="flex: 1;">
<div class="card-header">
<div class="card-icon"><i class="fas fa-chart-pie"></i></div>
<div>
<div class="card-title">詐騙類型分佈</div>
<div class="card-subtitle">各類型詐騙佔比分析</div>
</div>
</div>
<div class="stats-grid">
<div class="stat-item">
<div class="stat-value">35%</div>
<div class="stat-label">投資詐騙</div>
</div>
<div class="stat-item">
<div class="stat-value">28%</div>
<div class="stat-label">交友詐騙</div>
</div>
<div class="stat-item">
<div class="stat-value">22%</div>
<div class="stat-label">假冒身分</div>
</div>
<div class="stat-item">
<div class="stat-value">15%</div>
<div class="stat-label">其他類型</div>
</div>
</div>
</div>
<div class="section-card" style="flex: 1;">
<div class="card-header">
<div class="card-icon"><i class="fas fa-robot"></i></div>
<div>
<div class="card-title">模型效能比較</div>
<div class="card-subtitle">傳統ML vs LLM</div>
</div>
</div>
<div class="chart-container">
<div class="chart-title">
<i class="fas fa-chart-line"></i>
                        效能趨勢分析
                    </div>
<div style="text-align: center; padding-bottom: 10px;">
<div style="font-size: 42px; font-weight: 800; color: #3b82f6; line-height: 1;">+46%</div>
<div style="font-size: 15px; color: #94a3b8; margin-top: 10px; font-weight: 500;">準確率提升</div>
</div>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
